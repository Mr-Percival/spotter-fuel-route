<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuel Route Planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef;--panel:#ffffff;--ink:#1b1d1f;--muted:#5d646b;--line:#dcdad3;
  --route:#1d4ed8;--stop:#c2410c;--good:#15803d;--chip:#eeece6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121416;--panel:#1b1e21;--ink:#e8e6e1;--muted:#9aa1a8;--line:#2c3035;
  --route:#60a5fa;--stop:#fb923c;--good:#4ade80;--chip:#24282c;}}
:root[data-theme="dark"]{--bg:#121416;--panel:#1b1e21;--ink:#e8e6e1;--muted:#9aa1a8;--line:#2c3035;
  --route:#60a5fa;--stop:#fb923c;--good:#4ade80;--chip:#24282c;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif;
  display:grid;grid-template-columns:380px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:20px 20px 28px}
#map{height:100%;min-height:320px}
h1{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.trip{font-size:20px;font-weight:600;margin:0 0 16px}
.trip span{color:var(--muted);font-weight:400}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.kpi{background:var(--chip);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font:500 20px "IBM Plex Mono",monospace}
.kpi small{color:var(--muted)}
.kpi.main{grid-column:1/-1}
.kpi.main b{font-size:28px}
.save{color:var(--good)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
li:hover .nm{text-decoration:underline}
.n{width:24px;height:24px;border-radius:50%;background:var(--stop);color:#fff;font:600 12px/24px "IBM Plex Mono",monospace;text-align:center}
.nm{font-weight:500}
.sub{color:var(--muted);font-size:13px}
.amt{text-align:right;font-family:"IBM Plex Mono",monospace}
.amt small{display:block;color:var(--muted)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}
dt{color:var(--muted)} dd{margin:0;font-family:"IBM Plex Mono",monospace}
.badge{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 8px;font-size:12px;color:var(--muted);margin:0 4px 4px 0}
.proto{background:#fef3c7;color:#78350f;border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:14px}
.leaflet-popup-content{font:13px/1.4 "IBM Plex Sans",sans-serif}
@media (max-width:820px){
  body{grid-template-columns:1fr;grid-template-rows:48vh auto;height:auto}
  #map{grid-row:1;height:48vh}
  aside{grid-row:2;border-right:0;border-top:1px solid var(--line);padding:16px}
}
</style>
</head>
<body>
<aside>
  <div class="proto">Prototype — illustrative NY → LA route with real prices from the assessment CSV. Geometry is simplified.</div>
  <h1>Fuel plan</h1>
  <p class="trip" id="trip"></p>
  <div class="kpis" id="kpis"></div>
  <h2>Fuel stops</h2>
  <ol id="stops"></ol>
  <h2>Assumptions</h2>
  <div id="assumptions"></div>
  <h2>Performance</h2>
  <dl id="perf"></dl>
</aside>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const R = {"origin": {"query": "New York, NY", "lat": 40.71, "lon": -74.01}, "destination": {"query": "Los Angeles, CA", "lat": 34.05, "lon": -118.24}, "distance_miles": 2841.2, "duration_hours": 45.8, "assumptions": {"tank_gallons": 50, "mpg": 10, "max_range_miles": 500, "initial_fuel_gallons": 50, "corridor_miles": 10, "price_rule": "lowest retail price per OPIS station id", "detour_cost": "ignored (stations within the corridor)"}, "summary": {"total_cost": 706.33, "gallons_purchased": 234.12, "stops": 9, "avg_price_paid": 3.017, "savings_vs_naive": 13.58}, "fuel_stops": [{"sequence": 1, "opis_id": 2926, "name": "EXIT 77 TRAVEL PLAZA", "address": "I-81, EXIT 77 & SR-39", "city": "Harrisburg", "state": "PA", "lat": 40.27, "lon": -76.88, "off_route_miles": 0.8, "geo_precision": "city", "mile": 172.3, "price_per_gallon": 3.499, "gallons": 3.79, "cost": 13.26}, {"sequence": 2, "opis_id": 70717, "name": "Certified Oil #400491", "address": "I-270 EXIT 52", "city": "Columbus", "state": "OH", "lat": 39.96, "lon": -83.0, "off_route_miles": 0.8, "geo_precision": "city", "mile": 537.9, "price_per_gallon": 3.202, "gallons": 18.83, "cost": 60.3}, {"sequence": 3, "opis_id": 72755, "name": "RACETRAC #2620", "address": "I-465 Exit 42", "city": "Indianapolis", "state": "IN", "lat": 39.77, "lon": -86.16, "off_route_miles": 0.8, "geo_precision": "city", "mile": 726.2, "price_per_gallon": 3.159, "gallons": 25.78, "cost": 81.44}, {"sequence": 4, "opis_id": 2231, "name": "QUIKTRIP #605", "address": "I-270, EXIT 33", "city": "Saint Louis", "state": "MO", "lat": 38.63, "lon": -90.2, "off_route_miles": 0.8, "geo_precision": "city", "mile": 984.0, "price_per_gallon": 2.899, "gallons": 50.0, "cost": 144.95}, {"sequence": 5, "opis_id": 64112, "name": "RAPID ROBERTS #123", "address": "I-44, EXIT 80", "city": "Springfield", "state": "MO", "lat": 37.21, "lon": -93.29, "off_route_miles": 0.8, "geo_precision": "city", "mile": 1202.3, "price_per_gallon": 2.899, "gallons": 1.43, "cost": 4.15}, {"sequence": 6, "opis_id": 3383, "name": "E-Express at Central Truck Stop", "address": "I-35, EXIT 137", "city": "Oklahoma City", "state": "OK", "lat": 35.47, "lon": -97.52, "off_route_miles": 0.8, "geo_precision": "city", "mile": 1498.3, "price_per_gallon": 2.879, "gallons": 27.27, "cost": 78.51}, {"sequence": 7, "opis_id": 72816, "name": "QUIKTRIP #7914", "address": "I-27 EXIT 117", "city": "Amarillo", "state": "TX", "lat": 35.22, "lon": -101.83, "off_route_miles": 0.8, "geo_precision": "city", "mile": 1771.0, "price_per_gallon": 2.846, "gallons": 50.0, "cost": 142.28}, {"sequence": 8, "opis_id": 66678, "name": "NKS ROYAL TRUCKSTOP", "address": "I-40, EXIT 16", "city": "Gallup", "state": "NM", "lat": 35.53, "lon": -108.74, "off_route_miles": 0.8, "geo_precision": "city", "mile": 2212.7, "price_per_gallon": 3.119, "gallons": 44.17, "cost": 137.77}, {"sequence": 9, "opis_id": 5419, "name": "USA TRAVEL CENTER", "address": "I-40, EXIT 48 & US-93", "city": "Kingman", "state": "AZ", "lat": 35.19, "lon": -114.05, "off_route_miles": 0.8, "geo_precision": "city", "mile": 2549.8, "price_per_gallon": 3.399, "gallons": 12.85, "cost": 43.68}], "route": {"type": "Feature", "properties": {}, "geometry": {"type": "LineString", "coordinates": [[-74.01, 40.71], [-76.88, 40.27], [-79.99, 40.44], [-83.0, 39.96], [-86.16, 39.77], [-90.2, 38.63], [-93.29, 37.21], [-95.99, 36.15], [-97.52, 35.47], [-101.83, 35.22], [-106.65, 35.08], [-108.74, 35.53], [-111.65, 35.2], [-114.05, 35.19], [-117.02, 34.9], [-118.24, 34.05]]}}, "map_url": "/map/?start=New+York%2C+NY&finish=Los+Angeles%2C+CA", "meta": {"routing_api_calls": 1, "cache": "miss", "timings_ms": {"geocode": 0.2, "routing": 840.0, "corridor": 14.1, "optimize": 0.3, "total": 858.4}}, "warnings": []};
const $ = id => document.getElementById(id);
const usd = n => n.toLocaleString("en-US",{style:"currency",currency:"USD"});
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

$("trip").innerHTML = `${R.origin.query} <span>→</span> ${R.destination.query}`;
const s = R.summary;
$("kpis").innerHTML = `
  <div class="kpi main"><small>Total fuel cost</small><b>${usd(s.total_cost)}</b>
    ${s.savings_vs_naive != null ? `<small class="save">${usd(s.savings_vs_naive)} cheaper than filling up only when forced</small>`:""}</div>
  <div class="kpi"><small>Distance</small><b>${R.distance_miles.toLocaleString("en-US")} mi</b></div>
  <div class="kpi"><small>Stops</small><b>${s.stops}</b></div>
  <div class="kpi"><small>Gallons bought</small><b>${s.gallons_purchased}</b></div>
  <div class="kpi"><small>Avg $/gal paid</small><b>${s.avg_price_paid.toFixed(3)}</b></div>`;

const a = R.assumptions;
$("assumptions").innerHTML = [
  `${a.mpg} mpg`, `${a.tank_gallons} gal tank · ${a.max_range_miles} mi range`,
  `starts with ${a.initial_fuel_gallons} gal`, `corridor ±${a.corridor_miles} mi`,
  a.price_rule, `detour cost ${a.detour_cost}`
].map(t => `<span class="badge">${t}</span>`).join("");

const t = R.meta.timings_ms;
$("perf").innerHTML = `<dt>Routing API calls</dt><dd>${R.meta.routing_api_calls}</dd>` +
  Object.entries(t).map(([k,v]) => `<dt>${k}</dt><dd>${v} ms</dd>`).join("");

const map = L.map("map", {zoomControl:true});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:18, attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
const line = L.geoJSON(R.route, {style:{color:css("--route"), weight:5, opacity:.85}}).addTo(map);
map.fitBounds(line.getBounds(), {padding:[30,30]});

const pin = (label, cls) => L.divIcon({className:"", iconSize:[26,26],
  html:`<div style="width:26px;height:26px;border-radius:50%;background:${cls};color:#fff;
  font:600 12px/26px 'IBM Plex Mono',monospace;text-align:center;border:2px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.35)">${label}</div>`});
L.marker([R.origin.lat,R.origin.lon],{icon:pin("A","#111827")}).addTo(map).bindPopup(`<b>Start</b><br>${R.origin.query}`);
L.marker([R.destination.lat,R.destination.lon],{icon:pin("B","#111827")}).addTo(map).bindPopup(`<b>Finish</b><br>${R.destination.query}`);

const markers = R.fuel_stops.map(f => L.marker([f.lat,f.lon],{icon:pin(f.sequence, css("--stop"))})
  .addTo(map).bindPopup(`<b>${f.name}</b><br>${f.address}, ${f.city}, ${f.state}<br>
   Mile ${f.mile} · $${f.price_per_gallon.toFixed(3)}/gal<br>
   <b>${f.gallons} gal → ${usd(f.cost)}</b>`));

$("stops").innerHTML = R.fuel_stops.map((f,i) => `
  <li data-i="${i}"><span class="n">${f.sequence}</span>
   <span><span class="nm">${f.name}</span><br><span class="sub">${f.city}, ${f.state} · mile ${f.mile} · $${f.price_per_gallon.toFixed(3)}/gal</span></span>
   <span class="amt">${usd(f.cost)}<small>${f.gallons} gal</small></span></li>`).join("");
document.querySelectorAll("#stops li").forEach(li => li.onclick = () => {
  const m = markers[+li.dataset.i]; map.setView(m.getLatLng(), 9); m.openPopup();
});
</script>
</body>
</html>
