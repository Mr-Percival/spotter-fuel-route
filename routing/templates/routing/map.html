<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuel Route Planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef;--panel:#ffffff;--ink:#1b1d1f;--muted:#5d646b;--line:#dcdad3;
  --route:#1d4ed8;--stop:#c2410c;--good:#15803d;--chip:#eeece6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121416;--panel:#1b1e21;--ink:#e8e6e1;--muted:#9aa1a8;--line:#2c3035;
  --route:#60a5fa;--stop:#fb923c;--good:#4ade80;--chip:#24282c;}}
:root[data-theme="dark"]{--bg:#121416;--panel:#1b1e21;--ink:#e8e6e1;--muted:#9aa1a8;--line:#2c3035;
  --route:#60a5fa;--stop:#fb923c;--good:#4ade80;--chip:#24282c;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif;
  display:grid;grid-template-columns:380px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:20px 20px 28px}
#map{height:100%;min-height:320px}
h1{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.trip{font-size:20px;font-weight:600;margin:0 0 16px}
.trip span{color:var(--muted);font-weight:400}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.kpi{background:var(--chip);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font:500 20px "IBM Plex Mono",monospace}
.kpi small{color:var(--muted)}
.kpi.main{grid-column:1/-1}
.kpi.main b{font-size:28px}
.save{color:var(--good)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
li:hover .nm{text-decoration:underline}
.n{width:24px;height:24px;border-radius:50%;background:var(--stop);color:#fff;font:600 12px/24px "IBM Plex Mono",monospace;text-align:center}
.nm{font-weight:500}
.sub{color:var(--muted);font-size:13px}
.amt{text-align:right;font-family:"IBM Plex Mono",monospace}
.amt small{display:block;color:var(--muted)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}
dt{color:var(--muted)} dd{margin:0;font-family:"IBM Plex Mono",monospace}
.badge{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 8px;font-size:12px;color:var(--muted);margin:0 4px 4px 0}
.q{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-bottom:18px}
.q label{font-size:12px;color:var(--muted);display:grid;gap:4px}
.q input{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0}
.q button{font:600 14px "IBM Plex Sans",sans-serif;padding:8px 14px;border:0;border-radius:6px;background:var(--route);color:#fff;cursor:pointer}
.err{background:#fee2e2;color:#7f1d1d;border-radius:6px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.leaflet-popup-content{font:13px/1.4 "IBM Plex Sans",sans-serif}
@media (max-width:820px){
  body{grid-template-columns:1fr;grid-template-rows:48vh auto;height:auto}
  #map{grid-row:1;height:48vh}
  aside{grid-row:2;border-right:0;border-top:1px solid var(--line);padding:16px}
}
</style>
</head>
<body>
<aside>
  <form class="q" method="get" action="">
    <label>Start<input name="start" value="{{ form.start }}" placeholder="City, ST" required></label>
    <label>Finish<input name="finish" value="{{ form.finish }}" placeholder="City, ST" required></label>
    <button>Plan</button>
    {% if form.initial_fuel_gallons %}<input type="hidden" name="initial_fuel_gallons" value="{{ form.initial_fuel_gallons }}">{% endif %}
    {% if form.stop_cost_usd %}<input type="hidden" name="stop_cost_usd" value="{{ form.stop_cost_usd }}">{% endif %}
  </form>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <h1>Fuel plan</h1>
  <p class="trip" id="trip"></p>
  <div class="kpis" id="kpis"></div>
  <h2>Fuel stops</h2>
  <ol id="stops"></ol>
  <h2>Assumptions</h2>
  <div id="assumptions"></div>
  <h2>Performance</h2>
  <dl id="perf"></dl>
</aside>
<div id="map"></div>
{{ result|json_script:"plan" }}
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const R = JSON.parse(document.getElementById("plan").textContent);
const map = L.map("map", {zoomControl:true});
// OSM's tile policy requires a Referer; Django's default Referrer-Policy (same-origin)
// strips it from cross-origin requests, so ask for it explicitly on the tiles.
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:19, referrerPolicy:"strict-origin-when-cross-origin",
   attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
if (!R) { map.setView([39.5,-98.35],4); document.querySelectorAll("aside h1,aside h2,#trip,#kpis,#stops,#assumptions,#perf").forEach(e=>e.style.display="none"); throw "no plan"; }
const $ = id => document.getElementById(id);
const usd = n => n.toLocaleString("en-US",{style:"currency",currency:"USD"});
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

$("trip").innerHTML = `${esc(R.origin.resolved)} <span>→</span> ${esc(R.destination.resolved)}`;
const s = R.summary;
$("kpis").innerHTML = `
  <div class="kpi main"><small>Total fuel cost</small><b>${usd(s.total_cost)}</b>
    ${s.savings_vs_naive > 0 ? `<small class="save">${usd(s.savings_vs_naive)} cheaper than filling up only when forced</small>`:""}</div>
  <div class="kpi"><small>Distance</small><b>${R.distance_miles.toLocaleString("en-US")} mi</b></div>
  <div class="kpi"><small>Fuel stops</small><b>${s.stops}</b></div>
  <div class="kpi"><small>Trip fuel</small><b>${s.trip_fuel_gallons} gal</b></div>
  <div class="kpi"><small>Effective $/gal</small><b>${s.effective_price_per_gallon != null ? s.effective_price_per_gallon.toFixed(3) : "—"}</b></div>
  ${s.origin_fuel && s.origin_fuel.cost > 0 ? `<div class="kpi main"><small>Fuel to reach the first station: ${s.origin_fuel.gallons} gal, ${usd(s.origin_fuel.cost)}</small>
    <small>priced at ${esc(s.origin_fuel.priced_at)}</small></div>` : ""}`;

const a = R.assumptions;
$("assumptions").innerHTML = [
  `${a.mpg} mpg`, `${a.tank_gallons} gal tank · ${a.max_range_miles} mi range`,
  `start: ${a.initial_fuel}`, `$${a.stop_cost_usd} per stop`, `corridor ±${a.corridor_miles} mi`,
  a.detour, a.price_rule, ...(R.warnings||[])
].map(t => `<span class="badge">${esc(t)}</span>`).join("");

const t = R.meta.timings_ms;
$("perf").innerHTML = `<dt>Routing API calls</dt><dd>${R.meta.routing_api_calls}</dd>` +
  Object.entries(t).map(([k,v]) => `<dt>${k}</dt><dd>${v} ms</dd>`).join("");

const line = L.geoJSON(R.route, {style:{color:css("--route"), weight:5, opacity:.85}}).addTo(map);
map.fitBounds(line.getBounds(), {padding:[30,30]});

const pin = (label, cls) => L.divIcon({className:"", iconSize:[26,26],
  html:`<div style="width:26px;height:26px;border-radius:50%;background:${cls};color:#fff;
  font:600 12px/26px 'IBM Plex Mono',monospace;text-align:center;border:2px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.35)">${label}</div>`});
L.marker([R.origin.lat,R.origin.lon],{icon:pin("A","#111827")}).addTo(map).bindPopup(`<b>Start</b><br>${esc(R.origin.resolved)}`);
L.marker([R.destination.lat,R.destination.lon],{icon:pin("B","#111827")}).addTo(map).bindPopup(`<b>Finish</b><br>${esc(R.destination.resolved)}`);

const markers = R.fuel_stops.map(f => L.marker([f.lat,f.lon],{icon:pin(f.sequence, css("--stop"))})
  .addTo(map).bindPopup(`<b>${esc(f.name)}</b><br>${esc(f.address)}, ${esc(f.city)}, ${esc(f.state)}<br>
   Mile ${f.mile} · $${f.price_per_gallon.toFixed(3)}/gal<br>
   <b>${f.gallons} gal → ${usd(f.cost)}</b>`));

$("stops").innerHTML = R.fuel_stops.map((f,i) => `
  <li data-i="${i}"><span class="n">${f.sequence}</span>
   <span><span class="nm">${esc(f.name)}</span><br><span class="sub">${esc(f.city)}, ${esc(f.state)} · mile ${f.mile} · $${f.price_per_gallon.toFixed(3)}/gal</span></span>
   <span class="amt">${usd(f.cost)}<small>${f.gallons} gal</small></span></li>`).join("");
document.querySelectorAll("#stops li").forEach(li => li.onclick = () => {
  const m = markers[+li.dataset.i]; map.setView(m.getLatLng(), 9); m.openPopup();
});
</script>
</body>
</html>
